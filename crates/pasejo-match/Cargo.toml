[package]
name = "pasejo-match"
description = "Credential matching, look-alike domain detection and fill policies shared by pasejo's browser host and apps"
version.workspace = true
authors = ["Sebastian Hoß <seb@xn--ho-hia.de>"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
keywords = ["password", "manager", "autofill", "pasejo"]
categories = ["authentication"]

[dependencies]
pasejo-protocol = { path = "../pasejo-protocol", version = "=1.0.0", default-features = false }
psl = { version = "2.1.210" }
serde = { version = "1.0.228", features = ["derive"] }
unicode-security = { version = "0.1.3" }
url = { version = "2.5.4" }
zeroize = { version = "1.8.2", features = ["derive"] }
