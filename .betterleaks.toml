[extend]
useDefault = true

[[allowlists]]
description = "Fixed age identity shared by the test fixtures; it protects no real data"
regexTarget = "line"
regexes = [
  '''AGE-SECRET-KEY-14LGKWZMHDDWMLCL5EUU2FSQNEX33DZYR3F8VEPZSA670QRC3DA3SNSD535''',
  '''age1fdalwkzzv0vztxm08gmh6geddk095x0ww9ztfjdtlf673ynwugqssxx8qd''',
]

[[allowlists]]
description = "Deliberately invalid base32 OTP secret used by the rejection tests"
regexTarget = "line"
regexes = ['''JBSWY3DPEHPK3PX0''']

[[allowlists]]
description = "Throwaway passphrase-protected SSH key that pins the encrypted-identity detection; it protects no real data"
paths = ['''^tests/fixtures/passphrase-protected-ed25519$''']
