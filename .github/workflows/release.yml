name: Automated Release
on:
  schedule:
    - cron: 32 4 * * SUN
  workflow_dispatch:
permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit_count: ${{ steps.commits.outputs.count }}
      release_version: ${{ steps.release.outputs.version }}
      previous_version: ${{ steps.last_release.outputs.tag }}
    steps:
      - id: checkout
        name: Clone Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: last_release
        name: Fetch last release info
        run: echo "tag=$(gh release view --json tagName --jq '.tagName')" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: commits
        name: Count Commits
        run: echo "count=$(git rev-list --count ${{ steps.last_release.outputs.tag }}..HEAD -- src Cargo.toml Cargo.lock)" >> $GITHUB_OUTPUT
      - id: release
        name: Create Release Version
        if: steps.commits.outputs.count > 0 || steps.last_release.outputs.tag == ''
        run: echo "version=$(date +'%Y.%-m.%-d')" >> $GITHUB_OUTPUT
  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: pasejo
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: pasejo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: pasejo
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary_name: pasejo
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: pasejo
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary_name: pasejo
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            binary_name: pasejo.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            binary_name: pasejo.exe
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: pasejo.exe
    steps:
      - id: checkout
        name: Clone Git Repository
        if: needs.prepare.outputs.release_version != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache
        if: needs.prepare.outputs.release_version != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install prerequisites
        if: needs.prepare.outputs.release_version != '' && startsWith(matrix.os, 'ubuntu')
        run: |
          case ${{ matrix.target }} in
            aarch64-unknown-linux-gnu)  sudo apt-get -y update ; sudo apt-get -y install gcc-aarch64-linux-gnu ;;
            aarch64-unknown-linux-musl) sudo apt-get -y update ; sudo apt-get -y install gcc-aarch64-linux-gnu musl-tools ;;
            x86_64-unknown-linux-musl)  sudo apt-get -y update ; sudo apt-get -y install musl-tools ;;
          esac
      - name: Set up env variables
        if: needs.prepare.outputs.release_version != '' && startsWith(matrix.os, 'ubuntu')
        run: |
          case ${{ matrix.target }} in
            aarch64-unknown-linux-gnu) echo JEMALLOC_SYS_WITH_LG_PAGE=16 >> $GITHUB_ENV ;;
            aarch64-unknown-linux-musl) echo CC=aarch64-linux-gnu-gcc >> $GITHUB_ENV; echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc >> $GITHUB_ENV ; echo CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="-Clink-self-contained=yes -Clinker=rust-lld" >> $GITHUB_ENV; echo JEMALLOC_SYS_WITH_LG_PAGE=16 >> $GITHUB_ENV ;;
          esac
      - name: Set up Rust Target
        if: needs.prepare.outputs.release_version != ''
        run: rustup target add ${{ matrix.target }}
      - id: versioning
        name: Modify release version
        if: needs.prepare.outputs.release_version != ''
        run: sed -i -e '0,/authors/s/^version = .*/version = "${{ needs.prepare.outputs.release_version }}"/' Cargo.toml
      - id: build
        name: Build Project
        if: needs.prepare.outputs.release_version != ''
        run: cargo build --release --target ${{ matrix.target }}
      - id: move
        name: Move Binary
        if: needs.prepare.outputs.release_version
        run: mv target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./${{ matrix.binary_name }}
      - id: tar
        name: Create tar.gz Archive
        if: needs.prepare.outputs.release_version != ''
        run: >
          tar --create --gzip
          --file pasejo-${{ matrix.target }}.tar.gz
          ${{ matrix.binary_name }}
          LICENSE
          README.md
      - id: upload
        name: Upload Artifact
        if: needs.prepare.outputs.release_version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.target }}
          path: ${{ github.event.repository.name }}-${{ matrix.target }}.tar.gz
  release:
    name: Perform Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # cosign keyless sign-blob
    steps:
      - id: checkout
        name: Clone Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.prepare.outputs.release_version != ''
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: needs.prepare.outputs.release_version != ''
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: needs.prepare.outputs.release_version != ''
      - id: download
        name: Download Artifacts
        if: needs.prepare.outputs.release_version != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: ${{ github.event.repository.name }}-*
          merge-multiple: true
      - id: checksums
        name: Calculate Checksums
        if: needs.prepare.outputs.release_version != ''
        run: sha256sum *.tar.gz > SHA256SUMS
        working-directory: dist
      - id: sign_checksums
        name: Sign Checksums
        if: needs.prepare.outputs.release_version != ''
        uses: metio/ci/cosign-sign-blob@d4a165ac035d1fa1a7aee5b27192d0aed9c7a0b0 # 2026.11.1111906
        with:
          file: dist/SHA256SUMS
      - id: create_release
        name: Create Release
        if: needs.prepare.outputs.release_version != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_version }}
          name: ${{ needs.prepare.outputs.release_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.bundle
      - id: versioning
        name: Modify release version
        if: needs.prepare.outputs.release_version != ''
        run: sed -i -e '0,/authors/s/^version = .*/version = "${{ needs.prepare.outputs.release_version }}"/' Cargo.toml
      - name: Publish to crates.io
        if: needs.prepare.outputs.release_version != ''
        run: >
          cargo publish
          --allow-dirty
          --token ${{ secrets.CRATES_IO_TOKEN }}
          --jobs 1
          --no-verify
        env:
          RUSTFLAGS: "-A warnings"
